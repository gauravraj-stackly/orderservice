spring.application.name=orderservice
server.port=8082
user.service.base-url=http://localhost:8081
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=2s
resilience4j.retry.instances.paymentService.retry-exceptions=org.springframework.web.client.HttpServerErrorException
